<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go — Energy Today</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="growth.css">
</head>
<body>
<div class="growth-wrap">
  <p class="growth-kicker">Download Energy Today</p>
  <h1>Opening Google Play…</h1>
  <p id="status">Saving this tap, then the app. Energy Today runs fully automated daily energy on your phone.</p>
  <p style="margin: 18px 0;">
    <a class="btn-primary" id="play-fallback" href="https://play.google.com/store/apps/details?id=com.kea.energytoday">Download Energy Today</a>
  </p>
  <p id="fault" class="fault"></p>
</div>
<script src="config.js"></script>
<script src="growth.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var src = (q.get("src") || "website").toLowerCase();
  var campaign = q.get("c") || "";
  var cfg = window.KEA_GROWTH || {};
  var status = document.getElementById("status");
  var faultEl = document.getElementById("fault");
  var gone = false;
  var fallback = document.getElementById("play-fallback");
  if (!(cfg.sources && cfg.sources[src])) src = "website";
  if (fallback) fallback.href = KeaGrowth.playUrl(src, campaign) || cfg.playStoreUrl;

  var api = (cfg.trackApi || "https://www.kea.today/api/funnel");
  var row = KeaGrowth.record("play_tap", { src: src, campaign: campaign });
  status.textContent = "Logged " + src + ". Opening Play…";
  var img = new Image();
  img.src = api + "?type=play_tap&src=" + encodeURIComponent(src) + "&c=" + encodeURIComponent(campaign) + "&n=" + Date.now();
  fetch(api, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(row),
    keepalive: true,
    mode: "cors"
  })
    .then(function () { go(); })
    .catch(function () { go(); });
  setTimeout(go, 2200);
})();
</script>
</body>
</html>
