<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go — Energy Today</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="growth.css">
</head>
<body>
<div class="growth-wrap">
  <p class="growth-kicker">Growth engine</p>
  <h1>Opening Energy Today…</h1>
  <p id="status" class="hero-description">Preparing tracked link.</p>
  <p id="fault" class="fault"></p>
</div>
<script src="config.js"></script>
<script src="growth.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var src = (params.get("src") || "website").toLowerCase();
  var cfg = window.KEA_GROWTH || {};
  var allowed = cfg.sources || {};
  var status = document.getElementById("status");
  var faultEl = document.getElementById("fault");

  if (!cfg.playStoreUrl) {
    status.textContent = "Play Store URL is not set.";
    faultEl.textContent = KeaGrowth.fault("402.1.1.0", "Fill playStoreUrl in config.js — see FAULTS.md");
    return;
  }

  if (!allowed[src]) {
    faultEl.textContent = KeaGrowth.fault("402.1.2.0", "Unknown src. Use youtube, facebook, instagram, tiktok, website, or reading.");
    src = "website";
  }

  var result = KeaGrowth.recordClick(src);
  function go() {
    var url = KeaGrowth.playUrl(src);
    status.textContent = "Redirecting to Google Play (" + src + ").";
    if (result && result.code) {
      faultEl.textContent = KeaGrowth.fault(result.code, result.code === "402.2.1.0"
        ? "Sheet not connected yet. Click saved in this browser only."
        : "Sheet append failed. Visitor still sent to Play Store.");
    }
    window.location.replace(url);
  }

  if (result && typeof result.then === "function") {
    result.then(function (r) {
      result = r;
      setTimeout(go, 400);
    });
  } else {
    setTimeout(go, 400);
  }
})();
</script>
</body>
</html>
