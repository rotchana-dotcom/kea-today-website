<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go — Energy Today</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="growth.css">
</head>
<body>
<div class="growth-wrap">
  <p class="growth-kicker">Growth engine</p>
  <h1>Opening Energy Today…</h1>
  <p id="status">Preparing tracked link.</p>
  <p id="fault" class="fault"></p>
</div>
<script src="config.js"></script>
<script src="growth.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var src = (q.get("src") || "website").toLowerCase();
  var campaign = q.get("c") || "";
  var cfg = window.KEA_GROWTH || {};
  var status = document.getElementById("status");
  var faultEl = document.getElementById("fault");

  if (!cfg.playStoreUrl) {
    status.textContent = "Play Store URL is not set.";
    faultEl.textContent = KeaGrowth.fault("402.1.1.0", "Fill playStoreUrl in config.js");
    return;
  }
  if (!(cfg.sources && cfg.sources[src])) {
    faultEl.textContent = KeaGrowth.fault("402.1.2.0", "Unknown src; using website.");
    src = "website";
  }

  var result = KeaGrowth.recordClick(src);
  KeaGrowth.record("play_tap", { src: src, campaign: campaign });
  if (result && result.code) {
    faultEl.textContent = KeaGrowth.fault(
      result.code,
      result.code === "402.2.1.0"
        ? "Sheet not connected. Event saved here and sent to /api/track."
        : "Sheet append may have failed. Visitor still goes to Play."
    );
  }
  status.textContent = "Redirecting (" + src + (campaign ? " · " + campaign : "") + ")";
  setTimeout(function () {
    window.location.replace(KeaGrowth.playUrl(src, campaign));
  }, 350);
})();
</script>
</body>
</html>
